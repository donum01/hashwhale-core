spring:
  application:
    name: core

  datasource:
    url: jdbc:mysql://localhost:3306/hashwhale
    username: root
    password: "hashwhale123"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Base64-encoded 256-bit (or stronger) key. Set this outside source control.
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
